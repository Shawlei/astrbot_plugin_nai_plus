name: astrbot_plugin_nai_plus
display_name: Nai2API 生图（nai_plus 增强版）
desc: >
  通过 Nai2API 网关调用 NovelAI 生成图片。支持 /nai 指令和 LLM 工具调用，
  内置 NovelAI V5 模型、提示词直译（中文/英文自动转英文标签）、
  按模型区分扣点与高扣点二次确认、自定义命令名。
  OpenAI 兼容直译接口独立配置地址与密钥，模型可从接口实时拉取下拉选择。
  内置 1576 条词库（角色名 830/外观 469/场景 277）直接查表不走模型，角色名 100% 准确、
  纯标签输入免调用模型；纯英文简写（2b/dva/saber）自动补全为完整消歧标签，英文多词标签（long hair）不会被切碎；
  连写输入（「鸣潮达妮娅」）自动兜底识别、口语前缀（「画一个」）自动剥离；
  支持自定义词库文件；翻译结果自动校验残留中文并重翻；提示词约束禁止模型脑补未提及的外观；画师串拼入正向提示词、质量词自动加权；画师串里的负权重自动移入负面提示词；预设自带构图标签且无构图时自动补景别，不再张张都是半身。
  支持群聊黑名单：黑名单里的群无论谁发什么指令都不会触发生图，且机器人彻底静默不回复；
  自定义预设可在 WebUI 的「预设管理」里直接增删改（点几下就行，不用改文件也不用发指令），
  与 /nai save 等指令操作同一份数据、互不冲突；
  支持图生图（回复一张图再发指令），后端是通用 HTTP 模板，
  任何支持图生图的渠道填好请求模板即可接入。
  基于 helloWKQ/AstrBot_Nai2API 二开。
version: 1.4.2
author: Shawlei
astrbot_version: ">=4.26.0,<5"
repo: https://github.com/Shawlei/astrbot_plugin_nai_plus
